version: '3.8'

services:
  # Development Next.js Application
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: coffee-vercel-dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coffee_machine
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: coffee-machine-secret-key-development
      NODE_ENV: development
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres
    networks:
      - coffee-network
    restart: unless-stopped

  # PostgreSQL Database for development
  postgres:
    image: postgres:15-alpine
    container_name: coffee-vercel-dev-postgres
    environment:
      POSTGRES_DB: coffee_machine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - coffee-network
    restart: unless-stopped

volumes:
  postgres_dev_data:

networks:
  coffee-network:
    driver: bridge
